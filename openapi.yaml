openapi: 3.0.3
info:
  title: Otter PPT API
  version: 0.1.0
  description: Generate editable PowerPoint files using configured models, external tool calls, or presentation JSON. AI credentials are optional for execute/build.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/generate:
    post:
      operationId: generatePresentation
      summary: Generate a presentation with the configured LLM
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: Generated presentation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/execute:
    post:
      operationId: executeToolCalls
      summary: Apply externally generated tool calls without invoking an AI model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRequest' }
      responses:
        '200':
          description: Updated presentation and tool results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecuteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/build:
    post:
      operationId: buildPresentation
      summary: Build an editable PPTX from presentation JSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Presentation' }
      responses:
        '200':
          description: PPTX file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/tools:
    get:
      operationId: listTools
      summary: List AI design tool definitions
      responses:
        '200':
          description: Tool definitions
          content:
            application/json:
              schema:
                type: object
                required: [tools, tool_count]
                properties:
                  tools: { type: array, items: { type: object, additionalProperties: true } }
                  tool_count: { type: integer }
  /api/v1/download:
    get:
      operationId: downloadPresentation
      summary: Download a generated PPTX once
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PPTX file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    GenerateRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string }
        language: { type: string, default: zh }
        slides: { type: integer, minimum: 1, default: 8 }
        style: { type: string }
    ToolCall:
      type: object
      required: [name]
      properties:
        name: { type: string }
        arguments: { type: object, additionalProperties: true }
    ExecuteRequest:
      type: object
      required: [calls]
      properties:
        presentation: { $ref: '#/components/schemas/Presentation' }
        calls:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ToolCall' }
    ExecuteResponse:
      type: object
      required: [presentation, results]
      properties:
        presentation: { $ref: '#/components/schemas/Presentation' }
        results:
          type: array
          items: { type: object, additionalProperties: true }
    GenerateResponse:
      type: object
      required: [presentation, total_steps, done]
      properties:
        presentation: { $ref: '#/components/schemas/Presentation' }
        steps: { type: array, items: { type: object, additionalProperties: true } }
        total_steps: { type: integer }
        done: { type: boolean }
        download_url: { type: string }
    Presentation:
      type: object
      required: [title, theme, slides]
      properties:
        title: { type: string }
        theme: { $ref: '#/components/schemas/Theme' }
        slides: { type: array, items: { $ref: '#/components/schemas/Slide' } }
        slide_width: { type: number, default: 13.333 }
        slide_height: { type: number, default: 7.5 }
    Theme:
      type: object
      required: [primary_color, secondary_color, accent_color, background_color, text_color, title_font, body_font]
      properties:
        name: { type: string }
        primary_color: { type: string }
        secondary_color: { type: string }
        accent_color: { type: string }
        background_color: { type: string }
        text_color: { type: string }
        title_font: { type: string }
        body_font: { type: string }
    Slide:
      type: object
      required: [id, layout, elements]
      properties:
        id: { type: string }
        layout: { type: string }
        background: { type: object, additionalProperties: true }
        transition: { type: object, additionalProperties: true }
        notes: { type: string }
        elements:
          type: array
          items: { type: object, additionalProperties: true }
