openapi: 3.0.3
info:
  title: Otter PPT API
  version: 0.1.0
  description: Generate editable PowerPoint files using configured models, external tool calls, or presentation JSON. AI credentials are optional for execute/build.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/generate:
    post:
      operationId: generatePresentation
      summary: Generate a presentation with the configured LLM
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: Generated presentation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/execute:
    post:
      operationId: executeToolCalls
      summary: Apply externally generated tool calls without invoking an AI model (stateless)
      description: |
        Stateless — pass the full `presentation` and the updated state is returned.
        For iterative editing (and server-side undo/redo) prefer the stateful
        session endpoints: POST /api/v1/session, then POST /api/v1/session/{id}/execute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRequest' }
      responses:
        '200':
          description: Updated presentation and tool results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecuteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/render:
    post:
      operationId: renderPresentation
      summary: Render presentation JSON to slide images (base64)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Presentation' }
      responses:
        '200':
          description: Rendered slide images
          content:
            application/json:
              schema:
                type: object
                properties:
                  backend: { type: string }
                  slide_count: { type: integer }
                  slides:
                    type: array
                    items:
                      type: object
                      properties:
                        slide_num: { type: integer }
                        width: { type: integer }
                        height: { type: integer }
                        image_base64: { type: string }
                        description: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/session:
    post:
      operationId: createSession
      summary: Create a stateful editing session (undo/redo without reshipping state)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                presentation: { $ref: '#/components/schemas/Presentation' }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [session_id]
                properties:
                  session_id: { type: string }
                  expires_in: { type: string, example: 30m0s }
                  slide_count: { type: integer }
                  usage: { type: object, additionalProperties: true }
  /api/v1/session/{id}:
    get:
      operationId: getSessionState
      summary: Get current presentation state of a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  presentation: { $ref: '#/components/schemas/Presentation' }
                  slide_count: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      summary: Drop a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/session/{id}/execute:
    post:
      operationId: executeSessionToolCalls
      summary: Run tool calls against a server-side session (atomic batch, no state round-trip)
      description: |
        Calls run as one atomic batch: if any call fails, the session is
        rolled back to its pre-request state (response carries
        `rolled_back: true`) — no partial effects survive. On success the
        whole batch is a single undo step.

        Optional `idempotency_key` (unique per logical batch, e.g. a UUID):
        retrying a completed request with the same key returns the cached
        response (`idempotent_replay: true`) without re-executing. Both 200
        and 422 outcomes are cached (a failed batch is rolled back, so the
        replay is exact); per session up to 64 keys are kept, oldest first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calls]
              properties:
                calls:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ToolCall' }
                idempotency_key:
                  type: string
                  description: Unique key per logical batch; safe retries return the cached response (200 and 422 both cached; FIFO, 64 keys per session)
      responses:
        '200':
          description: Tool results and updated presentation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecuteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/session/{id}/render:
    post:
      operationId: renderSession
      summary: Render the session's current state to slide images
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rendered slide images (same shape as /api/v1/render) }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/session/{id}/build:
    post:
      operationId: buildSession
      summary: Build a PPTX from the session's current state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PPTX file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/session/{id}/undo:
    post:
      operationId: undoSession
      summary: Undo the last mutating tool call
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Undo result }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/session/{id}/redo:
    post:
      operationId: redoSession
      summary: Redo the last undone tool call
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Redo result }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/build:
    post:
      operationId: buildPresentation
      summary: Build an editable PPTX from presentation JSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Presentation' }
      responses:
        '200':
          description: PPTX file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/tools:
    get:
      operationId: listTools
      summary: List AI design tool definitions
      responses:
        '200':
          description: Tool definitions
          content:
            application/json:
              schema:
                type: object
                required: [tools, tool_count]
                properties:
                  tools: { type: array, items: { type: object, additionalProperties: true } }
                  tool_count: { type: integer }
  /api/v1/download:
    get:
      operationId: downloadPresentation
      summary: Download a generated PPTX once
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PPTX file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    GenerateRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string }
        language: { type: string, default: zh }
        slides: { type: integer, minimum: 1, default: 8 }
        style: { type: string }
    ToolCall:
      type: object
      required: [name]
      properties:
        name: { type: string }
        arguments: { type: object, additionalProperties: true }
    ExecuteRequest:
      type: object
      required: [calls]
      properties:
        presentation: { $ref: '#/components/schemas/Presentation' }
        calls:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ToolCall' }
    ExecuteResponse:
      type: object
      required: [presentation, results]
      properties:
        presentation: { $ref: '#/components/schemas/Presentation' }
        results:
          type: array
          items: { type: object, additionalProperties: true }
    GenerateResponse:
      type: object
      required: [presentation, total_steps, done]
      properties:
        presentation: { $ref: '#/components/schemas/Presentation' }
        steps: { type: array, items: { type: object, additionalProperties: true } }
        total_steps: { type: integer }
        done: { type: boolean }
        download_url: { type: string }
    Presentation:
      type: object
      required: [title, theme, slides]
      properties:
        title: { type: string }
        theme: { $ref: '#/components/schemas/Theme' }
        slides: { type: array, items: { $ref: '#/components/schemas/Slide' } }
        slide_width: { type: number, default: 13.333 }
        slide_height: { type: number, default: 7.5 }
    Theme:
      type: object
      required: [primary_color, secondary_color, accent_color, background_color, text_color, title_font, body_font]
      properties:
        name: { type: string }
        primary_color: { type: string }
        secondary_color: { type: string }
        accent_color: { type: string }
        background_color: { type: string }
        text_color: { type: string }
        title_font: { type: string }
        body_font: { type: string }
    Slide:
      type: object
      required: [id, layout, elements]
      properties:
        id: { type: string }
        layout: { type: string }
        background: { type: object, additionalProperties: true }
        transition: { type: object, additionalProperties: true }
        notes: { type: string }
        elements:
          type: array
          items: { type: object, additionalProperties: true }
