name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Cross-compile and upload to GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: Release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
            label: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ''
            label: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: .exe
            label: windows-amd64
          - goos: darwin
            goarch: amd64
            suffix: ''
            label: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: ''
            label: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/otter-ppt-${{ matrix.label }}${{ matrix.suffix }} \
            ./cmd/otter-ppt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/otter-ppt-${{ matrix.label }}${{ matrix.suffix }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
