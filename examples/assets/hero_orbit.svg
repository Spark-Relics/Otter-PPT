<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- halo -->
  <circle cx="230" cy="210" r="200" fill="url(#glow)"/>

  <!-- concentric rings -->
  <circle cx="230" cy="210" r="150" stroke="url(#ring1)" stroke-width="1.4"/>
  <circle cx="230" cy="210" r="118" stroke="url(#ring2)" stroke-width="1.1"/>
  <circle cx="230" cy="210" r="86" stroke="url(#ring1)" stroke-width="0.9" stroke-dasharray="3 6"/>

  <!-- core hexagon -->
  <path d="M230 168l36 21v42l-36 21-36-21v-42z" stroke="#22D3EE" stroke-width="1.6"/>
  <path d="M230 186l19 11v22l-19 11-19-11v-22z" stroke="#A78BFA" stroke-width="1.2"/>
  <circle cx="230" cy="210" r="4" fill="#22D3EE"/>

  <!-- orbital nodes -->
  <circle cx="230" cy="60" r="5" fill="#22D3EE" fill-opacity="0.9"/>
  <circle cx="359" cy="285" r="4" fill="#A78BFA" fill-opacity="0.85"/>
  <circle cx="101" cy="285" r="4" fill="#22D3EE" fill-opacity="0.7"/>
  <circle cx="359" cy="135" r="3" fill="#7DD3FC" fill-opacity="0.6"/>
  <circle cx="101" cy="135" r="3" fill="#A78BFA" fill-opacity="0.55"/>

  <!-- connection spokes -->
  <path d="M230 65v103M355 282l-104-58M105 282l104-58" stroke="#475569" stroke-width="0.9" stroke-dasharray="2 5" stroke-opacity="0.8"/>

  <!-- floating chips -->
  <g stroke="#155E75" stroke-width="1">
    <rect x="30" y="52" width="96" height="30" rx="8" fill="#141B2E" fill-opacity="0.85"/>
    <path d="M44 67h10M60 61l6 6-6 6" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="76" y="60" width="38" height="10" rx="3" fill="#1E293B"/>
  </g>
  <g stroke="#6D4FD8" stroke-width="1">
    <rect x="344" y="340" width="96" height="30" rx="8" fill="#101830" fill-opacity="0.85"/>
    <circle cx="362" cy="355" r="6" stroke="#A78BFA" stroke-width="1.6"/>
    <path d="M366 359l5 5" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="378" y="350" width="48" height="10" rx="3" fill="#1E293B"/>
  </g>

  <!-- sparkle dots -->
  <circle cx="80" cy="180" r="1.6" fill="#7DD3FC" fill-opacity="0.7"/>
  <circle cx="392" cy="200" r="1.8" fill="#A78BFA" fill-opacity="0.7"/>
  <circle cx="330" cy="80" r="1.4" fill="#22D3EE" fill-opacity="0.6"/>
  <circle cx="140" cy="330" r="1.5" fill="#7DD3FC" fill-opacity="0.55"/>
</svg>
