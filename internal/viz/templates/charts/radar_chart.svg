<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Radar Chart Template: 4-8 capability dimensions scored across 1-3 entities. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 100">
        <text x="80" y="86" font-size="34" font-weight="800" fill="#0F172A">Capability Profile</text>
        <text x="80" y="118" font-size="14" fill="#64748B">Six dimensions scored across two entities · scale 0-100</text>
    </g>

    <g id="chartArea" data-pptx-bounds="100 160 1080 470" data-pptx-replace-with="chart">
        <metadata type="application/json">
            {"type":"radar","categories":["Speed","Quality","Cost","Innovation","Reliability","Service"],"series":[{"name":"Current","values":[70,82,64,58,76,68]},{"name":"Target","values":[90,85,75,80,88,82]}],"style":{"colors":["#2563EB","#F59E0B"]}}
        </metadata>
        <!-- chart-plot-area: 260,190,760,390 -->
        <g transform="translate(640,390)">
            <polygon points="0,-190 165,-95 165,95 0,190 -165,95 -165,-95" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
            <polygon points="0,-126 110,-63 110,63 0,126 -110,63 -110,-63" fill="none" stroke="#E2E8F0" stroke-width="1"/>
            <polygon points="0,-63 55,-32 55,32 0,63 -55,32 -55,-32" fill="none" stroke="#E2E8F0" stroke-width="1"/>
            <line x1="0" y1="-190" x2="0" y2="190" stroke="#E2E8F0" stroke-width="1"/>
            <line x1="-165" y1="-95" x2="165" y2="95" stroke="#E2E8F0" stroke-width="1"/>
            <line x1="165" y1="-95" x2="-165" y2="95" stroke="#E2E8F0" stroke-width="1"/>
            <polygon points="0,-133 142,-58 105,83 0,110 -120,68 -109,-69"
                     fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="2.5"/>
            <polygon points="0,-171 148,-78 121,60 0,152 -136,62 -139,-82"
                     fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 4"/>
        </g>
        <g font-size="15" font-weight="700" fill="#0F172A">
            <text x="640" y="185" text-anchor="middle">Speed</text>
            <text x="820" y="300">Quality</text>
            <text x="820" y="490">Cost</text>
            <text x="640" y="610" text-anchor="middle">Innovation</text>
            <text x="460" y="490" text-anchor="end">Reliability</text>
            <text x="460" y="300" text-anchor="end">Service</text>
        </g>
    </g>

    <g id="legend" data-pptx-bounds="900 200 320 100">
        <g font-size="15" fill="#0F172A">
            <rect x="910" y="225" width="28" height="8" fill="#2563EB"/>
            <text x="950" y="233">Current</text>
            <rect x="910" y="255" width="28" height="8" fill="#F59E0B"/>
            <text x="950" y="263">Target</text>
        </g>
    </g>

    <g id="source" data-pptx-bounds="60 660 1160 30">
        <text x="80" y="680" font-size="13" fill="#94A3B8">Source: Capability assessment framework</text>
    </g>
</svg>
