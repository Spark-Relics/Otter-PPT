<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Gantt Chart Template: project schedule whose dates determine bar position/length. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 100">
        <text x="80" y="86" font-size="34" font-weight="800" fill="#0F172A">Project Schedule</text>
        <text x="80" y="118" font-size="14" fill="#64748B">Six tasks across eight weeks · bars encode start and duration</text>
    </g>

    <g id="chartArea" data-pptx-bounds="80 160 1120 490" data-pptx-replace-with="chart">
        <metadata type="application/json">
            {"type":"gantt","categories":["Research","Requirements","Design","Implementation","Testing","Release"],"starts":[0,1,2,3,5,7],"ends":[2,3,4,7,8,8],"weeks":8}
        </metadata>
        <!-- chart-plot-area: 320,200,1020,520 -->
        <g stroke="#E2E8F0" stroke-width="1">
            <line x1="320" y1="200" x2="1180" y2="200"/>
            <line x1="320" y1="280" x2="1180" y2="280"/>
            <line x1="320" y1="360" x2="1180" y2="360"/>
            <line x1="320" y1="440" x2="1180" y2="440"/>
            <line x1="320" y1="520" x2="1180" y2="520"/>
        </g>
        <g font-size="14" font-weight="600" fill="#475569">
            <text x="300" y="232" text-anchor="end">Research</text>
            <text x="300" y="312" text-anchor="end">Requirements</text>
            <text x="300" y="392" text-anchor="end">Design</text>
            <text x="300" y="472" text-anchor="end">Implementation</text>
            <text x="300" y="552" text-anchor="end">Testing</text>
            <text x="300" y="632" text-anchor="end">Release</text>
        </g>
        <g font-size="13" fill="#64748B" text-anchor="middle">
            <text x="320" y="660">W1</text>
            <text x="535" y="660">W2</text>
            <text x="750" y="660">W4</text>
            <text x="965" y="660">W6</text>
            <text x="1180" y="660">W8</text>
        </g>
        <g>
            <rect x="320" y="206" width="215" height="26" fill="#2563EB"/>
            <rect x="427" y="286" width="215" height="26" fill="#2563EB"/>
            <rect x="535" y="366" width="215" height="26" fill="#2563EB"/>
            <rect x="642" y="446" width="430" height="26" fill="#2563EB"/>
            <rect x="857" y="526" width="215" height="26" fill="#2563EB"/>
            <rect x="1072" y="606" width="108" height="26" fill="#0EA5E9"/>
        </g>
        <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3">
            <line x1="642" y1="452" x2="642" y2="539"/>
            <line x1="857" y1="532" x2="857" y2="619"/>
        </g>
    </g>

    <g id="legend" data-pptx-bounds="80 655 1160 30">
        <rect x="80" y="672" width="14" height="14" fill="#2563EB"/>
        <text x="102" y="684" font-size="13" fill="#475569">In progress</text>
        <rect x="230" y="672" width="14" height="14" fill="#0EA5E9"/>
        <text x="252" y="684" font-size="13" fill="#475569">Milestone</text>
    </g>
</svg>
