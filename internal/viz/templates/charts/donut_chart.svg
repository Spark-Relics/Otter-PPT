<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Donut Chart Template: 3-6 proportions with a center KPI. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 100">
        <text x="80" y="86" font-size="34" font-weight="800" fill="#0F172A">Budget Composition</text>
        <text x="80" y="118" font-size="14" fill="#64748B">Proportions with center KPI · total spend</text>
    </g>

    <g id="chartArea" data-pptx-bounds="100 160 1080 470" data-pptx-replace-with="chart">
        <metadata type="application/json">
            {"type":"doughnut","categories":["Engineering","Marketing","Operations","Other"],"values":[45,25,20,10],"style":{"colors":["#2563EB","#0EA5E9","#14B8A6","#94A3B8"]}}
        </metadata>
        <!-- chart-plot-area: 300,180,640,380 -->
        <g transform="translate(580,380)">
            <path d="M0,-260 A260,260 0 0 1 160.6,-204.4 L124.1,-157.9 A200,200 0 0 0 0,-200 Z" fill="#2563EB"/>
            <path d="M160.6,-204.4 A260,260 0 0 1 245.7,-84.9 L189.0,-65.3 A200,200 0 0 0 124.1,-157.9 Z" fill="#0EA5E9"/>
            <path d="M245.7,-84.9 A260,260 0 0 1 -245.7,-84.9 L-189.0,-65.3 A200,200 0 0 0 189.0,-65.3 Z" fill="#14B8A6"/>
            <path d="M-245.7,-84.9 A260,260 0 0 1 -160.6,-204.4 L-124.1,-157.9 A200,200 0 0 0 -189.0,-65.3 Z" fill="#94A3B8"/>
        </g>
        <g font-size="40" font-weight="800" fill="#0F172A" text-anchor="middle">
            <text x="580" y="376">$4.8M</text>
            <text x="580" y="406" font-size="14" font-weight="600" fill="#64748B">Total budget</text>
        </g>
    </g>

    <g id="legend" data-pptx-bounds="900 250 320 200">
        <g font-size="15" fill="#0F172A">
            <circle cx="920" cy="290" r="7" fill="#2563EB"/>
            <text x="940" y="295">Engineering · 45%</text>
            <circle cx="920" cy="330" r="7" fill="#0EA5E9"/>
            <text x="940" y="335">Marketing · 25%</text>
            <circle cx="920" cy="370" r="7" fill="#14B8A6"/>
            <text x="940" y="375">Operations · 20%</text>
            <circle cx="920" cy="410" r="7" fill="#94A3B8"/>
            <text x="940" y="415">Other · 10%</text>
        </g>
    </g>

    <g id="source" data-pptx-bounds="60 660 1160 30">
        <text x="80" y="680" font-size="13" fill="#94A3B8">Source: Annual budget planning</text>
    </g>
</svg>
