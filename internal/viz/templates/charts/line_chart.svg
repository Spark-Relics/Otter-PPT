<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Line Chart Template: 1-3 time-series showing direction. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 100">
        <text x="80" y="86" font-size="34" font-weight="800" fill="#0F172A">Trend Over Time</text>
        <text x="80" y="118" font-size="14" fill="#64748B">Monthly direction for a single continuous metric</text>
    </g>

    <g id="chartArea" data-pptx-bounds="100 160 1080 470" data-pptx-replace-with="chart">
        <metadata type="application/json">
            {"type":"line","categories":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"name":"Revenue","values":[120,135,160,148,182,196]}],"style":{"color":"#2563EB"}}
        </metadata>
        <!-- chart-plot-area: 140,180,1040,380 -->
        <g stroke="#E2E8F0" stroke-width="1">
            <line x1="140" y1="220" x2="1180" y2="220"/>
            <line x1="140" y1="300" x2="1180" y2="300"/>
            <line x1="140" y1="380" x2="1180" y2="380"/>
            <line x1="140" y1="460" x2="1180" y2="460"/>
            <line x1="140" y1="540" x2="1180" y2="540"/>
        </g>
        <line x1="140" y1="180" x2="140" y2="560" stroke="#0F172A" stroke-width="2"/>
        <line x1="140" y1="560" x2="1180" y2="560" stroke="#0F172A" stroke-width="2"/>
        <g font-size="13" fill="#64748B">
            <text x="120" y="184" text-anchor="end">200</text>
            <text x="120" y="304" text-anchor="end">150</text>
            <text x="120" y="464" text-anchor="end">100</text>
        </g>
        <g font-size="14" font-weight="600" fill="#475569" text-anchor="middle">
            <text x="240" y="582">Jan</text>
            <text x="440" y="582">Feb</text>
            <text x="640" y="582">Mar</text>
            <text x="840" y="582">Apr</text>
            <text x="1040" y="582">May</text>
            <text x="1180" y="582">Jun</text>
        </g>
        <polyline points="240,484 440,465 640,388 840,434 1040,304 1180,276"
                  fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#2563EB" stroke="#FFFFFF" stroke-width="2">
            <circle cx="240" cy="484" r="6"/>
            <circle cx="440" cy="465" r="6"/>
            <circle cx="640" cy="388" r="6"/>
            <circle cx="840" cy="434" r="6"/>
            <circle cx="1040" cy="304" r="6"/>
            <circle cx="1180" cy="276" r="6"/>
        </g>
        <g font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">
            <text x="240" y="470">120</text>
            <text x="440" y="451">135</text>
            <text x="640" y="374">160</text>
            <text x="840" y="420">148</text>
            <text x="1040" y="290">182</text>
            <text x="1180" y="262">196</text>
        </g>
    </g>

    <g id="source" data-pptx-bounds="60 660 1160 30">
        <text x="80" y="680" font-size="13" fill="#94A3B8">Source: Monthly revenue dashboard</text>
    </g>
</svg>
