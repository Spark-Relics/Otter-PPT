<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Funnel Chart Template: 3-5 sequential conversion stages with drop-off. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 100">
        <text x="80" y="86" font-size="34" font-weight="800" fill="#0F172A">Conversion Funnel</text>
        <text x="80" y="118" font-size="14" fill="#64748B">Sequential stages with drop-off between each · total volume 10,000</text>
    </g>

    <g id="chartArea" data-pptx-bounds="120 150 760 500" data-pptx-replace-with="chart">
        <metadata type="application/json">
            {"type":"funnel","categories":["Awareness","Interest","Consideration","Conversion"],"values":[10000,4500,1800,650],"style":{"colors":["#2563EB","#0284C7","#0D9488","#EA580C"]}}
        </metadata>
        <!-- chart-plot-area: 260,180,760,440 -->
        <g>
            <path d="M320,180 L860,180 L820,260 L360,260 Z" fill="#2563EB"/>
            <text x="590" y="226" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Awareness · 10,000</text>
            <text x="590" y="248" font-size="15" fill="#FFFFFF" text-anchor="middle" opacity="0.9">100%</text>

            <path d="M360,290 L820,290 L780,370 L400,370 Z" fill="#0284C7"/>
            <text x="590" y="336" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Interest · 4,500</text>
            <text x="590" y="358" font-size="15" fill="#FFFFFF" text-anchor="middle" opacity="0.9">45%</text>

            <path d="M400,400 L780,400 L740,480 L440,480 Z" fill="#0D9488"/>
            <text x="590" y="446" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Consideration · 1,800</text>
            <text x="590" y="468" font-size="15" fill="#FFFFFF" text-anchor="middle" opacity="0.9">18%</text>

            <path d="M440,510 L740,510 L700,590 L480,590 Z" fill="#EA580C"/>
            <text x="590" y="556" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Conversion · 650</text>
            <text x="590" y="578" font-size="15" fill="#FFFFFF" text-anchor="middle" opacity="0.9">6.5%</text>
        </g>
    </g>

    <g id="lossAnnotations" data-pptx-bounds="900 230 320 320">
        <g font-size="14" fill="#475569">
            <text x="910" y="255" font-size="16" font-weight="700" fill="#E11D48">-55% drop-off</text>
            <text x="910" y="275" font-size="13" fill="#64748B">Awareness → Interest</text>
            <text x="910" y="345" font-size="16" font-weight="700" fill="#E11D48">-60% drop-off</text>
            <text x="910" y="365" font-size="13" fill="#64748B">Interest → Consideration</text>
            <text x="910" y="435" font-size="16" font-weight="700" fill="#E11D48">-64% drop-off</text>
            <text x="910" y="455" font-size="13" fill="#64748B">Consideration → Conversion</text>
        </g>
    </g>

    <g id="insight" data-pptx-bounds="120 620 1080 70">
        <rect x="140" y="630" width="1040" height="52" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="160" y="662" font-size="15" font-weight="700" fill="#0F172A">Key insight: </text>
        <text x="272" y="662" font-size="15" fill="#475569">The largest drop-off occurs between Interest and Consideration — optimize the follow-up cadence here first.</text>
    </g>

    <g id="source" data-pptx-bounds="60 665 1160 30">
        <text x="80" y="700" font-size="13" fill="#94A3B8">Source: Internal CRM performance data</text>
    </g>
</svg>
