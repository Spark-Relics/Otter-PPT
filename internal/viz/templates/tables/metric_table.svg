<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Metric Table Template: operating metrics with current value, change, and status. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 90">
        <text x="80" y="82" font-size="32" font-weight="800" fill="#0F172A">Operating Metrics</text>
        <text x="80" y="112" font-size="14" fill="#64748B">Current value, change, and status per business unit</text>
    </g>

    <g id="metric-table" data-pptx-bounds="60 150 1160 500" data-pptx-replace-with="table">
        <metadata type="application/json">
            {"type":"metric","headers":["Unit","Metric","Current","Change","Target","Status"],"rows":[["North","Revenue","$1.2M","+12%","$1.1M","On track"],["North","Margin","31%","+2pp","30%","On track"],["South","Revenue","$0.9M","-4%","$1.0M","At risk"],["South","Margin","22%","-3pp","25%","At risk"],["West","Revenue","$1.5M","+18%","$1.3M","On track"]]}
        </metadata>
        <rect x="60" y="150" width="1160" height="60" fill="#E2E8F0"/>
        <rect x="60" y="210" width="1160" height="64" fill="#FFFFFF"/>
        <rect x="60" y="274" width="1160" height="64" fill="#F8FAFC"/>
        <rect x="60" y="338" width="1160" height="64" fill="#FFFFFF"/>
        <rect x="60" y="402" width="1160" height="64" fill="#F8FAFC"/>
        <rect x="60" y="466" width="1160" height="64" fill="#FFFFFF"/>
        <g stroke="#CBD5E1" stroke-width="1">
            <line x1="60" y1="210" x2="1220" y2="210"/>
            <line x1="60" y1="274" x2="1220" y2="274"/>
            <line x1="60" y1="338" x2="1220" y2="338"/>
            <line x1="60" y1="402" x2="1220" y2="402"/>
            <line x1="60" y1="466" x2="1220" y2="466"/>
            <line x1="60" y1="530" x2="1220" y2="530"/>
            <line x1="260" y1="150" x2="260" y2="530"/>
            <line x1="500" y1="150" x2="500" y2="530"/>
            <line x1="740" y1="150" x2="740" y2="530"/>
            <line x1="920" y1="150" x2="920" y2="530"/>
            <line x1="1060" y1="150" x2="1060" y2="530"/>
        </g>
        <g font-size="15" font-weight="700" fill="#334155">
            <text x="80" y="188">UNIT</text>
            <text x="280" y="188">METRIC</text>
            <text x="520" y="188">CURRENT</text>
            <text x="760" y="188">CHANGE</text>
            <text x="940" y="188">TARGET</text>
            <text x="1080" y="188">STATUS</text>
        </g>
        <g font-size="15" fill="#0F172A">
            <text x="80" y="250" font-weight="600">North</text>
            <text x="280" y="250">Revenue</text>
            <text x="520" y="250">$1.2M</text>
            <text x="760" y="250" fill="#059669" font-weight="600">+12%</text>
            <text x="940" y="250">$1.1M</text>
            <text x="1080" y="250" fill="#059669" font-weight="600">On track</text>

            <text x="80" y="314" font-weight="600">North</text>
            <text x="280" y="314">Margin</text>
            <text x="520" y="314">31%</text>
            <text x="760" y="314" fill="#059669" font-weight="600">+2pp</text>
            <text x="940" y="314">30%</text>
            <text x="1080" y="314" fill="#059669" font-weight="600">On track</text>

            <text x="80" y="378" font-weight="600">South</text>
            <text x="280" y="378">Revenue</text>
            <text x="520" y="378">$0.9M</text>
            <text x="760" y="378" fill="#E11D48" font-weight="600">-4%</text>
            <text x="940" y="378">$1.0M</text>
            <text x="1080" y="378" fill="#E11D48" font-weight="600">At risk</text>

            <text x="80" y="442" font-weight="600">South</text>
            <text x="280" y="442">Margin</text>
            <text x="520" y="442">22%</text>
            <text x="760" y="442" fill="#E11D48" font-weight="600">-3pp</text>
            <text x="940" y="442">25%</text>
            <text x="1080" y="442" fill="#E11D48" font-weight="600">At risk</text>

            <text x="80" y="506" font-weight="600">West</text>
            <text x="280" y="506">Revenue</text>
            <text x="520" y="506">$1.5M</text>
            <text x="760" y="506" fill="#059669" font-weight="600">+18%</text>
            <text x="940" y="506">$1.3M</text>
            <text x="1080" y="506" fill="#059669" font-weight="600">On track</text>
        </g>
    </g>

    <g id="source" data-pptx-bounds="60 660 1160 30">
        <text x="80" y="680" font-size="13" fill="#94A3B8">Source: Monthly operating review</text>
    </g>
</svg>
