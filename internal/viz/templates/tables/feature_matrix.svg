<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Feature Matrix Template: capabilities × offerings with state marks. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 90">
        <text x="80" y="82" font-size="32" font-weight="800" fill="#0F172A">Feature Matrix</text>
        <text x="80" y="112" font-size="14" fill="#64748B">Capabilities across offerings · supported, partial, or missing</text>
    </g>

    <g id="feature-matrix" data-pptx-bounds="60 150 1160 500" data-pptx-replace-with="table">
        <metadata type="application/json">
            {"type":"feature","headers":["Capability","Starter","Pro","Enterprise"],"rows":[["SSO / SAML","—","✓","✓"],["Custom roles","—","Partial","✓"],["API access","Partial","✓","✓"],["Audit logs","✓","✓","✓"],["Data residency","—","—","✓"]]}
        </metadata>
        <rect x="60" y="150" width="1160" height="60" fill="#E2E8F0"/>
        <rect x="60" y="210" width="1160" height="64" fill="#FFFFFF"/>
        <rect x="60" y="274" width="1160" height="64" fill="#F8FAFC"/>
        <rect x="60" y="338" width="1160" height="64" fill="#FFFFFF"/>
        <rect x="60" y="402" width="1160" height="64" fill="#F8FAFC"/>
        <rect x="60" y="466" width="1160" height="64" fill="#FFFFFF"/>
        <g stroke="#CBD5E1" stroke-width="1">
            <line x1="60" y1="210" x2="1220" y2="210"/>
            <line x1="60" y1="274" x2="1220" y2="274"/>
            <line x1="60" y1="338" x2="1220" y2="338"/>
            <line x1="60" y1="402" x2="1220" y2="402"/>
            <line x1="60" y1="466" x2="1220" y2="466"/>
            <line x1="60" y1="530" x2="1220" y2="530"/>
            <line x1="640" y1="150" x2="640" y2="530"/>
            <line x1="930" y1="150" x2="930" y2="530"/>
        </g>
        <g font-size="15" font-weight="700" fill="#334155">
            <text x="80" y="188">CAPABILITY</text>
            <text x="660" y="188" text-anchor="middle">STARTER</text>
            <text x="950" y="188" text-anchor="middle">PRO</text>
            <text x="1130" y="188" text-anchor="middle">ENTERPRISE</text>
        </g>
        <g font-size="15" fill="#0F172A">
            <text x="80" y="250">SSO / SAML</text>
            <text x="80" y="314">Custom roles</text>
            <text x="80" y="378">API access</text>
            <text x="80" y="442">Audit logs</text>
            <text x="80" y="506">Data residency</text>
        </g>
        <g font-size="16" text-anchor="middle">
            <text x="660" y="252" fill="#94A3B8">—</text>
            <text x="950" y="252" fill="#059669" font-weight="700">✓</text>
            <text x="1130" y="252" fill="#059669" font-weight="700">✓</text>

            <text x="660" y="316" fill="#94A3B8">—</text>
            <text x="950" y="316" fill="#D97706" font-weight="600">Partial</text>
            <text x="1130" y="316" fill="#059669" font-weight="700">✓</text>

            <text x="660" y="380" fill="#D97706" font-weight="600">Partial</text>
            <text x="950" y="380" fill="#059669" font-weight="700">✓</text>
            <text x="1130" y="380" fill="#059669" font-weight="700">✓</text>

            <text x="660" y="444" fill="#059669" font-weight="700">✓</text>
            <text x="950" y="444" fill="#059669" font-weight="700">✓</text>
            <text x="1130" y="444" fill="#059669" font-weight="700">✓</text>

            <text x="660" y="508" fill="#94A3B8">—</text>
            <text x="950" y="508" fill="#94A3B8">—</text>
            <text x="1130" y="508" fill="#059669" font-weight="700">✓</text>
        </g>
    </g>

    <g id="legend" data-pptx-bounds="60 660 1160 30">
        <text x="80" y="682" font-size="13" font-weight="700" fill="#059669">✓ Supported</text>
        <text x="280" y="682" font-size="13" font-weight="600" fill="#D97706">Partial</text>
        <text x="440" y="682" font-size="13" fill="#94A3B8">— Not available</text>
    </g>
</svg>
