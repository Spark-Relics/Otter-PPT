            <text x="1080" y="432" text-anchor="end">—</text>
            <text x="1200" y="432" text-anchor="end" font-weight="700">$280K</text>
        </g>
        <g font-size="14" fill="#0F172A">
            <text x="95" y="480">Initech</text>
            <text x="440" y="480" text-anchor="end">$30K</text>
            <text x="700" y="480" text-anchor="end">$35K</text>
            <text x="960" y="480" text-anchor="end">$40K</text>
            <text x="1080" y="480" text-anchor="end">$45K</text>
            <text x="1200" y="480" text-anchor="end">$150K</text>

            <text x="95" y="528">Umbrella</text>
            <text x="440" y="528" text-anchor="end">$25K</text>
            <text x="700" y="528" text-anchor="end">$30K</text>
            <text x="960" y="528" text-anchor="end">$35K</text>
            <text x="1080" y="528" text-anchor="end">$40K</text>
            <text x="1200" y="528" text-anchor="end">$130K</text>
