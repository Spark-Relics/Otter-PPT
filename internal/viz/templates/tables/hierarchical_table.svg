<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- Hierarchical Table Template: grouped rows with subtotal/total hierarchy. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header" data-pptx-bounds="60 40 1160 90">
        <text x="80" y="82" font-size="32" font-weight="800" fill="#0F172A">Revenue by Segment</text>
        <text x="80" y="112" font-size="14" fill="#64748B">Grouped rows with subtotals and a grand total</text>
    </g>

    <g id="hierarchical-table" data-pptx-bounds="60 150 1160 500" data-pptx-replace-with="table">
        <metadata type="application/json">
            {"type":"hierarchical","headers":["Segment","Q1","Q2","Q3","Q4","Total"],"groups":[{"label":"Enterprise","rows":[["Acme","$80K","$85K","$90K","$95K","$350K"],["Globex","$70K","$75K","$80K","$85K","$310K"]],"subtotal":"$660K"},{"label":"SMB","rows":[["Initech","$30K","$35K","$40K","$45K","$150K"],["Umbrella","$25K","$30K","$35K","$40K","$130K"]],"subtotal":"$280K"}],"total":"$940K"}
        </metadata>
        <rect x="60" y="150" width="1160" height="56" fill="#E2E8F0"/>
        <rect x="60" y="206" width="1160" height="50" fill="#0F172A"/>
        <rect x="60" y="256" width="1160" height="48" fill="#FFFFFF"/>
        <rect x="60" y="304" width="1160" height="48" fill="#F8FAFC"/>
        <rect x="60" y="352" width="1160" height="48" fill="#FFFFFF"/>
        <rect x="60" y="400" width="1160" height="48" fill="#0F172A"/>
        <rect x="60" y="448" width="1160" height="48" fill="#F8FAFC"/>
        <rect x="60" y="496" width="1160" height="48" fill="#FFFFFF"/>
        <rect x="60" y="544" width="1160" height="52" fill="#1D4ED8"/>
        <g stroke="#CBD5E1" stroke-width="1">
