            <line x1="60" y1="256" x2="1220" y2="256"/>
            <line x1="60" y1="304" x2="1220" y2="304"/>
            <line x1="60" y1="352" x2="1220" y2="352"/>
            <line x1="60" y1="400" x2="1220" y2="400"/>
            <line x1="60" y1="448" x2="1220" y2="448"/>
            <line x1="60" y1="496" x2="1220" y2="496"/>
            <line x1="60" y1="544" x2="1220" y2="544"/>
            <line x1="420" y1="150" x2="420" y2="596"/>
            <line x1="680" y1="150" x2="680" y2="596"/>
            <line x1="940" y1="150" x2="940" y2="596"/>
