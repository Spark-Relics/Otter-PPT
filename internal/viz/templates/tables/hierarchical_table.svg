            <text x="700" y="577" text-anchor="end">—</text>
            <text x="960" y="577" text-anchor="end">—</text>
            <text x="1080" y="577" text-anchor="end">—</text>
            <text x="1200" y="577" text-anchor="end" font-weight="800">$940K</text>
